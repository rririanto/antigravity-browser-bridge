<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Antigravity Browser Bridge</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #38bdf8;
      --accent-grad: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--accent-grad);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.4);
    }

    .logo svg {
      width: 16px;
      height: 16px;
      fill: #fff;
    }

    .title-box h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .title-box p {
      font-size: 11px;
      color: var(--text-muted);
    }

    .status-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      backdrop-filter: blur(8px);
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-badge.offline {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.3);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .tab-info {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .tab-title {
      font-size: 11.5px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .tab-url {
      font-size: 10px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: ui-monospace, SFMono-Regular, monospace;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn {
      width: 100%;
      padding: 8px 10px;
      font-size: 11.5px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--accent-grad);
      border: none;
      color: #0b0f19;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }

    .btn-primary:hover {
      opacity: 0.92;
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.45);
    }

    .btn-rec {
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.12);
      color: #fca5a5;
    }
    .btn-rec.recording {
      background: rgba(239, 68, 68, 0.35);
      border-color: #ef4444;
      color: #ffffff;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 10px;
      color: #64748b;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 19h20L12 2zm0 4l6.5 11h-13L12 6z"/></svg>
    </div>
    <div class="title-box">
      <h1>Antigravity Bridge</h1>
      <p>Visual CDP & Agent Engine</p>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="status-label">Bridge (Port 8765)</span>
      <span class="status-badge" id="bridge-status">
        <span class="status-dot"></span>
        <span id="bridge-status-text">Checking...</span>
      </span>
    </div>
    <div class="tab-info">
      <div class="tab-title" id="active-tab-title">Loading tab info...</div>
      <div class="tab-url" id="active-tab-url">...</div>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="btn-test-cursor">
      ✨ Test Visual Laser Cursor
    </button>
    <button class="btn" id="btn-tag-som">
      🏷️ Tag Elements (Set-of-Mark)
    </button>
    <button class="btn" id="btn-toggle-omnibar">
      💬 Open In-Page Omnibar (Cmd+Shift+K)
    </button>
    <button class="btn btn-rec" id="btn-record-macro">
      ⏺️ Start Macro Recorder
    </button>
  </div>

  <div class="footer">
    Antigravity IDE · Next-Gen AI Browser Engine
  </div>

  <script src="popup.js"></script>
</body>
</html>
